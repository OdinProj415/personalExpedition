<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vend+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebrators</title>
    <style>
        * {
            font-family: "Vend Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
    

        .button {
            background-color: #f7f7f7;
            border-radius: 8px;
            border-top: 1px solid #e0e0e0;
            border-left: 1px solid #e0e0e0;
            border-right: 5px solid #aaa;
            border-bottom: 5px solid #aaa;
            font-style: normal;
            line-height: 1.6;
            color: #333;
            padding: 8px;
            width: min(800px, 65%);
            display: inline-block;
            margin-top: 3px;
            margin-left: 7px;
            padding-top: 4px;
            padding-bottom: 4px;
            width:fit-content;
            font-family: "Chilanka", "Comic Sans MS", "Apple Chancery", "Bradley Hand", cursive, sans-serif;
            font-weight: 600;
            transform: scaleX(1.03);
        }
    </style>
</head>
<body>
    <h1 id="welcome" class="vend-sans-font">Welcome!</h1>
    <button onclick="restore()">Resume Progress</button>
    <script>
        function restore() {
            const pracorless = localStorage.getItem("pracorless");
            const li = localStorage.getItem("li");
            if (pracorless == "practice") {
                window.location.href = `./lessons/practice.html?li=${parseInt(li, 10)}`;
            } else if (pracorless == "lesson") {
                window.location.href = `./lessons/template.html?li=${parseInt(li, 10)}`;
            };
        }
        const name = localStorage.getItem("name");
        if (name != null) {
            const welcome = document.getElementById("welcome");
            welcome.innerText = "Welcome, " + name 
        } else {
            localStorage.setItem("name", JSON.stringify(prompt("What's your name?", "John")));
        }
    </script>
    <a href="./lessons/template.html?li=0"><button>Start from the beginning</button></a>
    
</body>
</html>
