<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chilanka&family=Vend+Sans:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Algebrators</title>

    <style>
        #title {
            font-family: "Vend Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }


        .content-block {
            background-color: #f7f7f7;
            border-radius: 8px;
            border-top: 1px solid #e0e0e0;
            border-left: 1px solid #e0e0e0;
            border-right: 5px solid #aaa;
            border-bottom: 5px solid #aaa;
            font-family: "Chilanka", "Comic Sans MS", "Apple Chancery", "Bradley Hand", cursive, sans-serif;
            font-weight: 400;
            font-style: normal;
            line-height: 1.6;
            color: #333;
            display: block;
            padding: 8px;
            width: min(800px, 65%);
        }

        .button {
            display: inline-block;
            margin-top: 3px;
            margin-left: 7px;
            padding-top: 4px;
            padding-bottom: 4px;
            width:fit-content;
            font-family: "Chilanka", "Comic Sans MS", "Apple Chancery", "Bradley Hand", cursive, sans-serif;
            font-weight: 600;
            transform: scaleX(1.03);
        }

        #back {
            margin-left: 0px;
        }
    </style>
</head>

<body>
    <h1 id="title">Loading Page Title...</h1>
    <div class="content-block" id="content-block">
        Loading Page Content...
    </div>
    <button class="button content-block" id="back">Back</button>
    <button class="button content-block" id="skip">Skip Practice</button>
    <button class="button content-block" id="practice"> &starf; Practice Concept &starf;</button>
    <script>
        let pageHTML;
        let titledoc = document.getElementById("title");
        let lessondoc = document.getElementById("content-block");
        const urlvars = new URLSearchParams(window.location.search);
        const lessonIndex = parseInt(urlvars.get("li"), 10);
        async function loadPage(lessonIndex) {
            try {
                const response = await fetch("prealgebra.json");
                const course = await response.json();
                const page = course[lessonIndex];
                console.log(`Content: \n\n ${page.content} \n\n\nTitle: \n\n ${page.title}`);
                console.log(page);
                titledoc.innerHTML = page.title;
                lessondoc.innerHTML = page.content;
                return page;
            } catch (error) {
                console.error("Error!", error);
            }
        };
        function redirect(lessonIndex) {
            console.log(lessonIndex);
            if (!(lessonIndex >= 0 && lessonIndex <= 10)) {
                alert("No more lessons in this direction!");
                lessonIndex = 0;
                alert("Redirecting to first lesson...");
            }
            window.location.href = `./template.html?li=${lessonIndex}`;
        }
        function doPractice(lessonIndex) {
            console.log(lessonIndex);
            if (!(lessonIndex >= 0 && lessonIndex <= 10)) {
                alert("No more lessons in this direction!");
                lessonIndex = 0;
                alert("Redirecting to first lesson...");
            }
            window.location.href = `./practice.html?li=${lessonIndex}`;
        };
        loadPage(lessonIndex);
        const practice = document.getElementById("practice");
        const next = document.getElementById("skip");
        const back = document.getElementById("back");
        next.addEventListener("click", () => redirect(lessonIndex + 1));
        back.addEventListener("click", () => redirect(lessonIndex - 1));
        practice.addEventListener("click", () => doPractice(lessonIndex));
    </script>

</body>

</html>
