<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chilanka&family=Vend+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Algebrators</title>

    <style>
    #title {
        font-family: "Vend Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
    }


    #content {
    background-color: #f7f7f7;
    border-radius: 8px;
    border-top: 1px solid #e0e0e0;
    border-left: 1px solid #e0e0e0;
    border-right: 5px solid #aaa;
    border-bottom: 5px solid #aaa;
    font-family: "Chilanka", "Comic Sans MS", "Apple Chancery", "Bradley Hand", cursive, sans-serif;
    font-weight: 400;
    font-style: normal;
    line-height: 1.6;
    color: #333;
    display: block;
    padding: 8px;
}
    </style>
</head>
<body>
    <h1 id="title">Loading Page Title...</h1>
    <p id="question">Loading Question</p>
    <button id="1">Loading...</button>
    <button id="2">Loading...</button>
    <button id="3">Loading...</button>
    <button id="4">Loading...</button>
    <script>
        let lessonIndex = 0;
        let isAnswered = false;
        let masteryMode = true;
        /* Fetch data and return lesson as an object */
        async function loadPage(lessonIndex) {
            try {
                const response = await fetch("prealgebra.json");
                const course = await response.json();
                const page = course[lessonIndex];
                console.log(`
                Content: \n 
                ${page.content} \n 
                \n \n 
                Title: \n 
                ${page.title} \n 
                \n \n 
                Practice: \n 
                ${page.practice.question} \n 
                \n \n
                Options: \n 
                ${page.practice.options[0].text}, ${page.practice.options[0].isCorrect}, ${page.practice.options[0].feedback} \n
                ${page.practice.options[1].text}, ${page.practice.options[1].isCorrect}, ${page.practice.options[1].feedback} \n 
                ${page.practice.options[2].text}, ${page.practice.options[2].isCorrect}, ${page.practice.options[2].feedback} \n
                ${page.practice.options[3].text}, ${page.practice.options[3].isCorrect}, ${page.practice.options[3].feedback}
                `);
                return page;
            } catch (error){
                console.error("Error!", error);
            }
        }
        page = loadPage(lessonIndex);
        page.then((page)=>{
            document.write(page.title);
        });
        let questions = {};
        questions.a = document.getElementById("1");
        questions.b = document.getElementById("2");
        questions.c = document.getElementById("3");
        questions.d = document.getElementById("4");
        questions.a.addEventListener("click",function() {
            page.then((page) => {
                if (page.practice.options[1].isCorrect) {
                    questions.a.style.color = "darkgreen";
                    questions.a.style.backgroundColor = "green";
                    isAnswered = true;
                } else {
                    if (masteryMode === false) {
                        isAnswered = true;
                    }
                    questions.a.style.color = "maroon";
                    questions.a.style.backgroundColor = "red";
                }
            });
        });
    </script>
    
</body>
</html>
